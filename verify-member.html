<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify NBA Awka member email</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100 flex items-center justify-center p-6"><main class="max-w-lg bg-white rounded-xl shadow p-8 text-center"><h1 class="text-2xl font-bold text-slate-900">NBA Awka email verification</h1><p id="status" class="mt-4 text-slate-700">Verifying your email…</p><a href="membershiplogin.html" class="inline-block mt-6 text-blue-800 underline">Return to member login</a></main><script>const API=window.NBA_MEMBER_API||'/api';const statusEl=document.getElementById('status');const token=new URLSearchParams(location.search).get('token');if(!token){statusEl.textContent='This verification link is missing its token. Request a new application email.';}else fetch(`${API}/auth/verify-email`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({token})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed.');statusEl.textContent=d.message;}).catch(e=>statusEl.textContent=e.message);</script></body></html>
