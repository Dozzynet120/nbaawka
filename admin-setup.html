<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set up NBA Awka admin access</title><script src="https://cdn.tailwindcss.com"></script>    <link rel="stylesheet" href="/site-responsive.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6"><main class="max-w-md w-full bg-white rounded-2xl shadow p-8">
 <h1 class="text-2xl font-bold">Set up admin access</h1><p id="intro" class="text-slate-600 mt-2">Choose a secure password for this administrator account.</p>
 <form id="form" class="space-y-4 mt-6"><label class="block text-sm">New password<input id="password" type="password" minlength="10" autocomplete="new-password" required class="w-full border rounded-lg p-3 mt-1"></label><label class="block text-sm">Confirm password<input id="confirm" type="password" minlength="10" autocomplete="new-password" required class="w-full border rounded-lg p-3 mt-1"></label><p class="text-xs text-slate-500">At least 10 characters, including lowercase, uppercase, a number, and a symbol.</p><button class="w-full bg-blue-900 text-white rounded-lg p-3 font-semibold">Create admin account</button></form>
 <p id="message" role="status" class="mt-5 text-sm"></p><a href="admin-console.html" class="inline-block mt-5 underline">Go to admin portal</a>
 </main><script>
 const q=new URLSearchParams(location.search), token=q.get('token'),type=q.get('type'),message=document.getElementById('message');
 const form=document.getElementById('form');
 form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){message.textContent='Passwords do not match.';return;}const path=type==='bootstrap'?'/admin/bootstrap/complete':'/admin/invitations/accept';try{const r=await fetch('/api'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to create account.');message.textContent=d.message||'Admin account created. Redirecting to sign in…';form.reset();history.replaceState({},'',location.pathname);setTimeout(()=>location.href='admin-console.html',1800);}catch(err){message.textContent=err.message;}});
 </script></body></html>
